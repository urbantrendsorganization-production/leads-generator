version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trendyyleads-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trendyyleads
      POSTGRES_PASSWORD: trendyyleads_dev
      POSTGRES_DB: trendyyleads
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
