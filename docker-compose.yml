name: trendyyleads

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: trendyyleads-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: urbanleads
      POSTGRES_PASSWORD: urbanleads_dev
      POSTGRES_DB: urbanleads
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanleads -d urbanleads"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trendyyleads-net

  # ── Express API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: trendyyleads-backend
    container_name: trendyyleads-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8006:3001"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npm start"
    networks:
      - trendyyleads-net

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.trendyyleads.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
    image: trendyyleads-frontend
    container_name: trendyyleads-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - trendyyleads-net

  # ── Nginx (reverse proxy for Next.js frontend) ──────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: trendyyleads-nginx
    container_name: trendyyleads-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:80"
    depends_on:
      - frontend
    networks:
      - trendyyleads-net

volumes:
  pgdata:

networks:
  trendyyleads-net:
    driver: bridge
