version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trendyyleads-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trendyyleads
      POSTGRES_PASSWORD: trendyyleads_dev
      POSTGRES_DB: trendyyleads
    ports:
      - '127.0.0.1:5437:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendyyleads -d trendyyleads"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trendyyleads-backend
    restart: unless-stopped
    environment:
      # Use internal port 5432 here, not 5437
      - DATABASE_URL=postgresql://trendyyleads:trendyyleads_dev@postgres:5432/trendyyleads
      - JWT_SECRET=FKIoGNN+v8YQ83x0C2v8t3ci3q6CusABBjTa7KJqs8s=
      - PAYSTACK_SECRET_KEY=sk_live_a5c69eb20aec8b812af0d1d3c7c20173de8728cb
      - PORT=3001
      - FRONTEND_URL=https://trendyyleads.com
      - HUNTER_API_KEY=c7fa1f5629edacb81e9190c92ec6db07cf86e895
      - WHATSAPP_API_
      - WHATSAPP_PHONE_NUMBER_ID=1073353965863268
      - GOOGLE_CLIENT_ID=947758188736-2rp6dpfhhad8b9p7957sfrrrpqrmc80h.apps.googleusercontent.com
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.trendyyleads.com
    container_name: trendyyleads-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.trendyyleads.com
    ports:
      - '127.0.0.1:3002:3000'
    depends_on:
      - backend

volumes:
  pgdata: